name: Lean Action CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Building the library takes a couple of minutes, but generating the documentation takes well over
# an hour. Without this, pushes made in quick succession leave several runs going at once, and their
# GitHub Pages deployments then compete for the same environment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

  imports:
    name: Check the root import list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every module must be imported by PadicModForms.lean
        run: |
          # A file missing from the root import list is never built, so CI would silently ignore it.
          find PadicModForms -name '*.lean' | sed -e 's|/|.|g' -e 's|\.lean$||' | sort > on-disk.txt
          # `SpherePacking/` need not be listed: it is reached through
          # `PadicModForms.SpherePacking.Bridge`, which is itself listed.
          grep -v '^PadicModForms\.SpherePacking\.' on-disk.txt > must-import.txt
          # Strip the `«…»` quoting of module names starting with a digit, e.g. `«38813»`.
          sed -n 's/^\(public \)\?import //p' PadicModForms.lean | tr -d '«»' | sort > imported.txt
          missing=$(comm -23 must-import.txt imported.txt | tr '\n' ' ')
          stale=$(comm -13 on-disk.txt imported.txt | tr '\n' ' ')
          if [ -n "$missing" ]; then
            echo "::error file=PadicModForms.lean::Not imported by PadicModForms.lean, hence" \
                 "never built: $missing"
          fi
          if [ -n "$stale" ]; then
            echo "::error file=PadicModForms.lean::Imported by PadicModForms.lean but missing" \
                 "from disk: $stale"
          fi
          [ -z "$missing$stale" ]

  docs:
    name: Build and deploy the documentation
    needs: build
    # Only `master` is allowed to deploy to GitHub Pages (see the branch policy of the
    # `github-pages` environment), so there is no point in spending an hour generating the
    # documentation for a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # let Pages verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover-community/docgen-action@v1
        with:
          blueprint: false
