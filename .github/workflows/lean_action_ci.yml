name: Lean Action CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Building the library takes a couple of minutes, but generating the documentation takes well over
# an hour. Without this, pushes made in quick succession leave several runs going at once, and their
# GitHub Pages deployments then compete for the same environment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

  imports:
    name: Check the root import list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every module must be imported by PadicModForms.lean
        run: |
          # A file missing from the root import list is never built, so CI would silently ignore it.
          find PadicModForms -name '*.lean' | sed -e 's|/|.|g' -e 's|\.lean$||' | sort > on-disk.txt
          # Strip the `«…»` quoting of module names starting with a digit, e.g. `«38813»`.
          sed -n 's/^\(public \)\?import //p' PadicModForms.lean | tr -d '«»' | sort > imported.txt
          missing=$(comm -23 on-disk.txt imported.txt | tr '\n' ' ')
          stale=$(comm -13 on-disk.txt imported.txt | tr '\n' ' ')
          if [ -n "$missing" ]; then
            echo "::error file=PadicModForms.lean::Not imported by PadicModForms.lean, hence" \
                 "never built: $missing"
          fi
          if [ -n "$stale" ]; then
            echo "::error file=PadicModForms.lean::Imported by PadicModForms.lean but missing" \
                 "from disk: $stale"
          fi
          [ -z "$missing$stale" ]

  docs:
    name: Build and deploy the documentation
    needs: build
    # Only `master` is allowed to deploy to GitHub Pages (see the branch policy of the
    # `github-pages` environment), so there is no point in spending an hour generating the
    # documentation for a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # let Pages verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
      # Builds the library with the mathlib cache, and leaves `lake` at `~/.elan/bin/lake`.
      - uses: leanprover/lean-action@v1

      # The site has two parts: the Verso document (`verso/`, served at the root) and the API
      # documentation generated by doc-gen4 (served at `/docs`). Both are assembled into `site/`
      # and deployed together, since a repository has a single GitHub Pages site.

      - name: Cache the Verso build
        uses: actions/cache@v4
        with:
          path: |
            verso/.lake/packages
            verso/.lake/build
          key: verso-${{ hashFiles('verso/lake-manifest.json', 'lean-toolchain') }}
      - name: Build the Verso document
        # `verso/` is a separate Lake package that takes the library and all of its dependencies
        # from this checkout (see `verso/lakefile.toml`), so this reuses the build above.
        working-directory: verso
        run: |
          ~/.elan/bin/lake build Doc
          ~/.elan/bin/lake exe generate

      - name: Cache the API documentation of the dependencies
        # Generating the documentation of mathlib takes well over an hour; it only changes when
        # the dependencies do.
        uses: actions/cache@v4
        with:
          path: docbuild/.lake/build
          key: docgen-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
      - name: Build the API documentation
        # This is what `leanprover-community/docgen-action` does, inlined because that action
        # insists on deploying the result itself, which would overwrite the Verso document.
        run: |
          mkdir -p docbuild
          cat > docbuild/lakefile.toml << EOF
          name = "docbuild"
          reservoir = false
          version = "0.1.0"
          packagesDir = "../.lake/packages"

          [[require]]
          name = "PadicModForms"
          path = "../"

          [[require]]
          scope = "leanprover"
          name = "doc-gen4"
          rev = "$(< lean-toolchain cut -f 2 -d: )"
          EOF
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 ~/.elan/bin/lake update PadicModForms
          ~/.elan/bin/lake build PadicModForms:docs

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r verso/_out/html-multi/. site/
          cp -r docbuild/.lake/build/doc site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
